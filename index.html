<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pulgarcito Web</title>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      #mapa {
        width: 100%;
        height: 100%;
      }

      #btnGPS {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #btnSeguirGPS {
        position: absolute;
        top: 65px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #btnWaypoint {
        position: absolute;
        top: 115px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #btnListaWaypoints {
        position: absolute;
        top: 165px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #panelWaypoints {
        display: none;

        position: absolute;
        top: 15px;
        right: 15px;
        z-index: 2000;

        width: 280px;
        max-height: 80%;

        overflow-y: auto;

        padding: 15px;

        background: white;
        border-radius: 10px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      #panelWaypoints h3 {
        margin-top: 0;
      }

      .waypointItem {
        padding: 10px;
        margin-bottom: 8px;

        border: 1px solid #ccc;
        border-radius: 6px;

        cursor: pointer;
      }

      .waypointItem:hover {
        background: #eeeeee;
      }
      .btnBorrarWaypoint {
        margin-top: 6px;
        padding: 6px 12px;

        border: none;
        border-radius: 5px;

        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <button id="btnGPS">Mi posición</button>
    <button id="btnSeguirGPS">Seguir GPS</button>
    <button id="btnWaypoint">Crear waypoint</button>
    <button id="btnListaWaypoints">Waypoints</button>
    <div id="mapa"></div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      // Crear mapa
      const mapa = L.map("mapa").setView([43.4623, -3.8099], 13);

      // Mapa OpenStreetMap provisional
      // Ortofoto PNOA Máxima Actualidad del IGN
      L.tileLayer
        .wms("https://www.ign.es/wms-inspire/pnoa-ma", {
          layers: "OI.OrthoimageCoverage",
          format: "image/jpeg",
          transparent: false,
          version: "1.3.0",
          attribution: "PNOA © Instituto Geográfico Nacional",
        })
        .addTo(mapa);
      // Recuperar waypoints guardados
      let waypoints =
        JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

      for (const waypoint of waypoints) {
        L.marker([waypoint.latitud, waypoint.longitud])
          .addTo(mapa)
          .bindPopup(waypoint.nombre);
      }
      // Waypoint seleccionado en el mapa
      let marcadorWaypoint = null;
      let crearWaypointActivo = false;

      document
        .getElementById("btnWaypoint")
        .addEventListener("click", function () {
          crearWaypointActivo = !crearWaypointActivo;

          if (crearWaypointActivo) {
            this.textContent = "Cancelar waypoint";
          } else {
            this.textContent = "Crear waypoint";
          }
        });
      mapa.on("click", function (e) {
        if (crearWaypointActivo === false) {
          return;
        }
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;

        console.log("Waypoint:", lat, lon);

        // Pedir el nombre del waypoint
        const nombre = prompt("Nombre del waypoint:", "");

        // Si se pulsa Cancelar, no crear el waypoint
        if (nombre === null) {
          return;
        }

        // Si se deja vacío, utilizar un nombre genérico
        let nombreWaypoint = nombre.trim();

        if (nombreWaypoint === "") {
          nombreWaypoint = "Waypoint";
        }

        // Crear objeto del waypoint
        const waypoint = {
          nombre: nombreWaypoint,
          latitud: lat,
          longitud: lon,
        };

        // Leer los waypoints que ya estaban guardados
        let waypoints =
          JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

        // Añadir el nuevo waypoint
        waypoints.push(waypoint);

        // Guardar todos los waypoints
        localStorage.setItem("pulgarcitoWaypoints", JSON.stringify(waypoints));

        console.log("Waypoint guardado:", waypoint);

        // Si ya había un waypoint mostrado, quitarlo
        if (marcadorWaypoint !== null) {
          mapa.removeLayer(marcadorWaypoint);
        }

        // Crear el marcador
        marcadorWaypoint = L.marker([lat, lon])
          .addTo(mapa)
          .bindPopup(nombreWaypoint)
          .openPopup();
      });
      // Botón GPS
      document
        .getElementById("btnGPS")
        .addEventListener("click", obtenerPosicion);
      let seguirGPS = false;

      document
        .getElementById("btnSeguirGPS")
        .addEventListener("click", function () {
          seguirGPS = !seguirGPS;

          if (seguirGPS) {
            this.textContent = "No seguir GPS";
          } else {
            this.textContent = "Seguir GPS";
          }
        });
      let seguimientoGPS = null;
      let marcadorGPS = null;

      // Obtener posición y comenzar seguimiento
      function obtenerPosicion() {
        if (!navigator.geolocation) {
          alert("Este dispositivo no permite obtener la posición GPS.");

          return;
        }

        // Si ya estaba activo, no iniciar otro seguimiento
        if (seguimientoGPS !== null) {
          return;
        }

        seguimientoGPS = navigator.geolocation.watchPosition(
          function (posicion) {
            const lat = posicion.coords.latitude;

            const lon = posicion.coords.longitude;

            console.log("Latitud:", lat, "Longitud:", lon);

            // Centrar el mapa solamente si está activado
            // el seguimiento GPS
            if (seguirGPS) {
              mapa.setView([lat, lon], 16);
            }
            // Crear el marcador solamente la primera vez
            if (marcadorGPS === null) {
              marcadorGPS = L.marker([lat, lon])
                .addTo(mapa)
                .bindPopup("Mi posición");
            } else {
              // En las siguientes lecturas,
              // solamente mover el marcador
              marcadorGPS.setLatLng([lat, lon]);
            }
          },

          function (error) {
            alert("No se ha podido obtener la posición GPS.");

            console.log(error);

            seguimientoGPS = null;
          },

          {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000,
          },
        );
      }
      document
        .getElementById("btnListaWaypoints")
        .addEventListener("click", mostrarListaWaypoints);

      document
        .getElementById("btnCerrarWaypoints")
        .addEventListener("click", function () {
          document.getElementById("panelWaypoints").style.display = "none";
        });

      function mostrarListaWaypoints() {
        const lista = document.getElementById("listaWaypoints");

        lista.innerHTML = "";

        const waypoints =
          JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

        if (waypoints.length === 0) {
          lista.innerHTML = "<p>No hay waypoints guardados.</p>";
        } else {
          waypoints.forEach(function (waypoint, indice) {
            const elemento = document.createElement("div");

            elemento.className = "waypointItem";

            elemento.innerHTML =
              "<strong>" +
              waypoint.nombre +
              "</strong><br>" +
              waypoint.latitud.toFixed(6) +
              "<br>" +
              waypoint.longitud.toFixed(6) +
              '<br><button class="btnBorrarWaypoint">' +
              "Borrar" +
              "</button>";

            elemento.addEventListener("click", function (evento) {
              if (evento.target.classList.contains("btnBorrarWaypoint")) {
                const confirmar = confirm(
                  '¿Desea borrar el waypoint "' + waypoint.nombre + '"?',
                );

                if (confirmar === false) {
                  return;
                }

                // Eliminar de la lista
                waypoints.splice(indice, 1);

                // Guardar la nueva lista
                localStorage.setItem(
                  "pulgarcitoWaypoints",
                  JSON.stringify(waypoints),
                );

                // Cerrar el popup si estuviera abierto
                mapa.closePopup();

                // Recargar los marcadores del mapa
                location.reload();

                return;
              }

              // Si no se ha pulsado Borrar,
              // centrar el mapa en el waypoint
              mapa.setView([waypoint.latitud, waypoint.longitud], 16);

              document.getElementById("panelWaypoints").style.display = "none";
            });
            lista.appendChild(elemento);
          });
        }

        document.getElementById("panelWaypoints").style.display = "block";
      }
    </script>
    <div id="panelWaypoints">
      <h3>Waypoints guardados</h3>

      <div id="listaWaypoints"></div>

      <button id="btnCerrarWaypoints">Cerrar</button>
    </div>
  </body>
</html>
