<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pulgarcito Web</title>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      #mapa {
        width: 100%;
        height: 100%;
      }

      #btnGPS {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #btnSeguirGPS {
        position: absolute;
        top: 65px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #btnWaypoint {
        position: absolute;
        top: 115px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #btnListaWaypoints {
        position: absolute;
        top: 165px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      #btnCancelarDestino {
        position: absolute;
        top: 265px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      #panelWaypoints {
        display: none;

        position: absolute;
        top: 15px;
        right: 15px;
        z-index: 2000;

        width: 280px;
        max-height: 80%;

        overflow-y: auto;

        padding: 15px;

        background: white;
        border-radius: 10px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      #panelWaypoints h3 {
        margin-top: 0;
      }

      .waypointItem {
        padding: 10px;
        margin-bottom: 8px;

        border: 1px solid #ccc;
        border-radius: 6px;

        cursor: pointer;
      }

      .waypointItem:hover {
        background: #eeeeee;
      }
      .btnBorrarWaypoint {
        margin-top: 6px;
        padding: 6px 12px;

        border: none;
        border-radius: 5px;

        cursor: pointer;
      }

      #infoDestino {
        display: none;

        position: absolute;
        top: 15px;
        left: 80px;
        z-index: 1000;

        width: 230px;

        padding: 12px;

        background: white;
        border-radius: 8px;

        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);

        font-size: 15px;
      }
      #btnCargarTrack {
        position: absolute;
        top: 315px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        background: white;
        border: none;
        border-radius: 8px;

        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      #btnBorrarTrack {
        position: absolute;
        top: 365px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        background: white;
        border: none;
        border-radius: 8px;

        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      #btnMostrarWaypoints {
        position: absolute;
        top: 215px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        background: white;
        border: none;
        border-radius: 8px;

        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      #barraBotones button {
        position: static;
        flex: 0 0 auto;
        padding: 10px 14px;
        font-size: 16px;
        border-radius: 10px;
      }

      #barraBotones {
        position: fixed;
        bottom: 10px;
        left: 10px;
        right: 10px;

        display: flex;
        gap: 8px;

        overflow-x: auto;
        overflow-y: hidden;

        z-index: 1000;

        padding: 4px;
      }
      #barraBotones::-webkit-scrollbar {
        display: none;
      }
      #barraBotones button.activo {
        background: #4caf50 !important;
        color: white !important;
      }

      .leaflet-control-zoom a {
        width: 60px !important;
        height: 60px !important;
        line-height: 60px !important;
        font-size: 40px !important;
      }
      #contadorPuntos {
        display: none;
        position: absolute;
        top: 15px;
        left: 80px;
        z-index: 1000;
        padding: 10px 14px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div id="barraBotones">
      <button id="btnGPS">Mi posición</button>
      <button id="btnSeguirGPS">Seguir GPS</button>
      <button id="btnWaypoint">Crear waypoint</button>
      <button id="btnListaWaypoints">Waypoints</button>
      <button id="btnMostrarWaypoints">Mostrar waypoints</button>
      <button id="btnCancelarDestino">Cancelar destino</button>
      <button id="btnGrabarTrack">Grabar track</button>
      <button id="btnCargarTrack">Cargar track</button>
      <button id="btnBorrarTrack">Borrar track</button>
      <button id="btnProbarMapaSD">Probar mapa SD</button>
    </div>
    <input
      type="file"
      id="inputTrack"
      accept=".trk,.gpx"
      style="display: none"
    />

    <div id="infoDestino">
      <strong>Destino</strong><br />
      <span id="nombreDestino">Ninguno</span><br />
      <span id="distanciaDestino">Distancia: --</span><br />
      <span id="rumboDestino">Rumbo: --</span>
    </div>

    <div id="mapa"></div>
    <div id="contadorPuntos">Puntos grabados: 0</div>

    <div id="panelWaypoints">
      <h3>Waypoints guardados</h3>

      <div id="listaWaypoints"></div>

      <button id="btnCerrarWaypoints">Cerrar</button>
    </div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.umd.min.js"></script>
    <script>
      // Crear mapa
      const mapa = L.map("mapa", {
        maxZoom: 22,
        rotate: true,
      }).setView([43.4623, -3.8099], 13);

      // ==============================
      // MAPA DE FONDO: PNOA
      // ==============================

      const mapaPNOA = L.tileLayer.wms(
        "https://www.ign.es/wms-inspire/pnoa-ma",
        {
          layers: "OI.OrthoimageCoverage",
          format: "image/jpeg",
          transparent: false,
          version: "1.3.0",
          attribution: "PNOA © Instituto Geográfico Nacional",
        },
      );

      // ==============================
      // MAPA DE FONDO: OFFLINE
      // ==============================

      let carpetaMapaSD = null;

      // ==============================
      // MAPA DE FONDO: OFFLINE
      // ==============================

      const mapaOffline = L.gridLayer({
        minZoom: 1,
        maxZoom: 18,
        maxNativeZoom: 14,
        attribution: "Mapa offline",

        // createTile: async function (coords, done) {
        //   const tile = document.createElement("img");

        //   tile.alt = "";
        //   tile.setAttribute("role", "presentation");

        //   if (carpetaMapaSD === null) {
        //     done(
        //       new Error("No se ha seleccionado la carpeta del mapa offline."),
        //       tile,
        //     );
        //     return tile;
        //   }

        //   try {

        //     const carpetaZ = await carpetaMapaSD.getDirectoryHandle(
        //       String(coords.z),
        //     );

        //     const carpetaX = await carpetaZ.getDirectoryHandle(
        //       String(coords.x),
        //     );

        //     const archivo = await carpetaX.getFileHandle(
        //       String(coords.y) + ".jpg",
        //     );

        //     const fichero = await archivo.getFile();

        //     const url = URL.createObjectURL(fichero);

        //     tile.onload = function () {
        //       URL.revokeObjectURL(url);
        //       done(null, tile);
        //     };

        //     tile.onerror = function () {
        //       URL.revokeObjectURL(url);
        //       done(new Error("No se ha podido mostrar el mosaico."), tile);
        //     };

        //     tile.src = url;
        //   } catch (error) {
        //     console.log(
        //       "No se ha encontrado el mosaico:",
        //       coords.z,
        //       coords.x,
        //       coords.y,
        //       error,
        //     );

        //     done(error, tile);
        //   }

        //   return tile;
        // },
        createTile: async function (coords, done) {
          alert(
            "SOLICITA: z=" + coords.z + " x=" + coords.x + " y=" + coords.y,
          );
          const tile = document.createElement("img");

          tile.alt = "";
          tile.setAttribute("role", "presentation");

          if (carpetaMapaSD === null) {
            done(
              new Error("No se ha seleccionado la carpeta del mapa offline."),
              tile,
            );
            return tile;
          }

          try {
            const carpetaZ = await carpetaMapaSD.getDirectoryHandle(
              String(coords.z),
            );

            const carpetaX = await carpetaZ.getDirectoryHandle(
              String(coords.x),
            );

            const archivo = await carpetaX.getFileHandle(
              String(coords.y) + ".jpg",
            );

            const fichero = await archivo.getFile();

            const url = URL.createObjectURL(fichero);

            tile.onload = function () {
              URL.revokeObjectURL(url);
              done(null, tile);
            };

            tile.onerror = function () {
              URL.revokeObjectURL(url);
              done(new Error("Error cargando JPG"), tile);
            };

            tile.src = url;
          } catch (error) {
            alert(
              "ERROR MAPA SD\n\n" +
                "z = " +
                coords.z +
                "\nx = " +
                coords.x +
                "\ny = " +
                coords.y +
                "\n\n" +
                error.name +
                "\n" +
                error.message,
            );

            done(error, tile);
          }

          return tile;
        },
      });

      // ==============================
      // MAPA INICIAL
      // ==============================

      mapaPNOA.addTo(mapa);

      // ==============================
      // SELECTOR DE MAPA DE FONDO
      // ==============================

      const mapasBase = {
        PNOA: mapaPNOA,
        "Mapa offline Cantabria": mapaOffline,
      };

      L.control
        .layers(mapasBase, null, {
          position: "topright",
        })
        .addTo(mapa);
      // Recuperar waypoints guardados
      let waypoints =
        JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

      // Waypoint seleccionado en el mapa
      let marcadorWaypoint = null;
      let waypointActivo = null;
      let crearWaypointActivo = false;
      let destinoAlcanzado = false;
      let audioDestino = null;
      let lineaTrack = null;
      let grabandoTrack = false;
      let puntosTrackGrabado = [];
      let lineaTrackGrabado = null;
      let carpetaTrackHandle = null;
      let mostrarTodosWaypoints = false;
      let marcadoresWaypoints = [];
      let ultimoTiempoTrack = null;
      let ultimaLatitudTrack = null;
      let ultimaLongitudTrack = null;

      function reproducirSonidoDestino() {
        if (audioDestino === null) {
          audioDestino = new (
            window.AudioContext || window.webkitAudioContext
          )();
        }

        if (audioDestino.state === "suspended") {
          audioDestino.resume();
        }

        function pitido() {
          const oscilador = audioDestino.createOscillator();

          const ganancia = audioDestino.createGain();

          oscilador.type = "sine";
          oscilador.frequency.value = 880;

          ganancia.gain.value = 0.5;

          oscilador.connect(ganancia);
          ganancia.connect(audioDestino.destination);

          oscilador.start();

          setTimeout(function () {
            oscilador.stop();
          }, 250);
        }

        pitido();

        setTimeout(function () {
          pitido();
        }, 350);

        setTimeout(function () {
          pitido();
        }, 700);

        setTimeout(function () {
          pitido();
        }, 1050);

        setTimeout(function () {
          pitido();
        }, 1400);

        setTimeout(function () {
          pitido();
        }, 1750);
      }

      document
        .getElementById("btnWaypoint")
        .addEventListener("click", async function () {
          if (ultimaLatitudGPS !== null && ultimaLongitudGPS !== null) {
            const lat = ultimaLatitudGPS;
            const lon = ultimaLongitudGPS;

            const nombre = prompt("Nombre del waypoint:", "");

            if (nombre === null) {
              return;
            }

            let nombreWaypoint = nombre.trim();

            if (nombreWaypoint === "") {
              nombreWaypoint = "Waypoint";
            }

            const waypoint = {
              nombre: nombreWaypoint,
              latitud: lat,
              longitud: lon,
            };

            let waypoints =
              JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

            waypoints.push(waypoint);

            localStorage.setItem(
              "pulgarcitoWaypoints",
              JSON.stringify(waypoints),
            );

            if (marcadorWaypoint !== null) {
              mapa.removeLayer(marcadorWaypoint);
            }

            marcadorWaypoint = L.marker([lat, lon])
              .addTo(mapa)
              .bindPopup(nombreWaypoint)
              .openPopup();

            return;
          }
          crearWaypointActivo = !crearWaypointActivo;

          if (crearWaypointActivo) {
            this.textContent = "Cancelar waypoint";
          } else {
            this.textContent = "Crear waypoint";
          }
        });
      mapa.on("click", function (e) {
        if (crearWaypointActivo === false) {
          return;
        }
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;

        console.log("Waypoint:", lat, lon);

        // Pedir el nombre del waypoint
        const nombre = prompt("Nombre del waypoint:", "");

        // Si se pulsa Cancelar, no crear el waypoint
        if (nombre === null) {
          return;
        }

        // Si se deja vacío, utilizar un nombre genérico
        let nombreWaypoint = nombre.trim();

        if (nombreWaypoint === "") {
          nombreWaypoint = "Waypoint";
        }

        // Crear objeto del waypoint
        const waypoint = {
          nombre: nombreWaypoint,
          latitud: lat,
          longitud: lon,
        };

        // Leer los waypoints que ya estaban guardados
        let waypoints =
          JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

        // Añadir el nuevo waypoint
        waypoints.push(waypoint);

        // Guardar todos los waypoints
        localStorage.setItem("pulgarcitoWaypoints", JSON.stringify(waypoints));

        console.log("Waypoint guardado:", waypoint);

        // Si ya había un waypoint mostrado, quitarlo
        if (marcadorWaypoint !== null) {
          mapa.removeLayer(marcadorWaypoint);
        }

        // Crear el marcador
        marcadorWaypoint = L.marker([lat, lon])
          .addTo(mapa)
          .bindPopup(nombreWaypoint)
          .openPopup();
      });

      // Botón GPS
      document.getElementById("btnGPS").addEventListener("click", function () {
        if (audioDestino === null) {
          audioDestino = new (
            window.AudioContext || window.webkitAudioContext
          )();
        }

        if (audioDestino.state === "suspended") {
          audioDestino.resume();
        }

        obtenerPosicion();
      });
      document
        .getElementById("btnCargarTrack")
        .addEventListener("click", async function () {
          if (!window.showDirectoryPicker) {
            alert(
              "Este navegador no permite seleccionar una carpeta directamente.",
            );
            return;
          }

          try {
            const carpeta = await window.showDirectoryPicker();

            const tracks = [];

            for await (const entrada of carpeta.values()) {
              if (
                entrada.kind === "file" &&
                entrada.name.toLowerCase().endsWith(".trk")
              ) {
                tracks.push(entrada);
              }
            }

            if (tracks.length === 0) {
              alert("No hay archivos .trk en esta carpeta.");
              return;
            }

            let mensaje = "Seleccione el track que desea cargar:\n\n";

            tracks.forEach(function (track, indice) {
              mensaje += indice + 1 + ". " + track.name + "\n";
            });

            const respuesta = prompt(mensaje);

            if (respuesta === null) {
              return;
            }

            const indice = parseInt(respuesta, 10) - 1;

            if (
              !Number.isInteger(indice) ||
              indice < 0 ||
              indice >= tracks.length
            ) {
              alert("Selección no válida.");
              return;
            }

            const archivo = await tracks[indice].getFile();

            const lector = new FileReader();

            lector.onload = function () {
              const lineas = lector.result.split(/\r?\n/);

              const puntosTrack = [];

              for (let i = 0; i + 10 < lineas.length; i += 11) {
                const lat = parseFloat(lineas[i].trim());

                const lon = parseFloat(lineas[i + 1].trim());

                if (
                  Number.isFinite(lat) &&
                  Number.isFinite(lon) &&
                  Math.abs(lat) <= 90 &&
                  Math.abs(lon) <= 180
                ) {
                  puntosTrack.push([lat, lon]);
                }
              }

              if (puntosTrack.length < 2) {
                alert("No se han encontrado suficientes puntos en el track.");
                return;
              }

              if (lineaTrack !== null) {
                mapa.removeLayer(lineaTrack);
              }

              lineaTrack = L.polyline(puntosTrack, {
                color: "blue",
                weight: 4,
              }).addTo(mapa);
              mapa.fitBounds(lineaTrack.getBounds());
            };

            lector.readAsText(archivo);
          } catch (error) {
            console.log("Error al cargar el track:", error);

            return;
          }
        });

      document
        .getElementById("btnBorrarTrack")
        .addEventListener("click", async function () {
          if (!window.showDirectoryPicker) {
            alert(
              "Este navegador no permite seleccionar una carpeta directamente.",
            );
            return;
          }

          try {
            const carpeta = await window.showDirectoryPicker({
              mode: "readwrite",
            });

            const tracks = [];

            for await (const entrada of carpeta.values()) {
              if (
                entrada.kind === "file" &&
                entrada.name.toLowerCase().endsWith(".trk")
              ) {
                tracks.push(entrada);
              }
            }

            if (tracks.length === 0) {
              alert("No hay archivos .trk en esta carpeta.");
              return;
            }

            let mensaje = "Escriba el número del track que desea borrar:\n\n";

            tracks.forEach(function (track, indice) {
              mensaje += indice + 1 + ". " + track.name + "\n";
            });

            const respuesta = prompt(mensaje);

            if (respuesta === null) {
              return;
            }

            const indice = parseInt(respuesta, 10) - 1;

            if (
              !Number.isInteger(indice) ||
              indice < 0 ||
              indice >= tracks.length
            ) {
              alert("Selección no válida.");
              return;
            }

            const trackSeleccionado = tracks[indice];

            const confirmar = confirm(
              "¿Desea borrar este track?\n\n" + trackSeleccionado.name,
            );

            if (!confirmar) {
              return;
            }

            await carpeta.removeEntry(trackSeleccionado.name);

            alert("Track borrado:\n" + trackSeleccionado.name);
          } catch (error) {
            console.log("Error al abrir la carpeta de tracks:", error);

            return;
          }
        });

      document
        .getElementById("inputTrack")
        .addEventListener("change", function () {
          const archivo = this.files[0];

          if (!archivo) {
            return;
          }

          console.log("Track seleccionado:", archivo.name);

          const lector = new FileReader();

          lector.onload = function () {
            const lineas = lector.result.split(/\r?\n/);

            const puntosTrack = [];

            // Cada punto del track ocupa 11 líneas.
            // Solo utilizamos las dos primeras:
            // línea 1 = latitud
            // línea 2 = longitud

            for (let i = 0; i + 10 < lineas.length; i += 11) {
              const lat = parseFloat(lineas[i].trim());
              const lon = parseFloat(lineas[i + 1].trim());

              if (
                Number.isFinite(lat) &&
                Number.isFinite(lon) &&
                Math.abs(lat) <= 90 &&
                Math.abs(lon) <= 180
              ) {
                puntosTrack.push([lat, lon]);
              }
            }
            console.log("Puntos del track encontrados:", puntosTrack.length);

            if (puntosTrack.length < 2) {
              alert("No se han encontrado suficientes puntos en el track.");
              return;
            }

            if (lineaTrack !== null) {
              mapa.removeLayer(lineaTrack);
            }

            lineaTrack = L.polyline(puntosTrack, {
              weight: 4,
            }).addTo(mapa);

            mapa.fitBounds(lineaTrack.getBounds());
          };
          lector.readAsText(archivo);
        });
      let seguirGPS = false;

      document
        .getElementById("btnSeguirGPS")
        .addEventListener("click", function () {
          seguirGPS = !seguirGPS;

          if (seguirGPS) {
            this.textContent = "No seguir GPS";
            this.classList.add("activo");
          } else {
            this.textContent = "Seguir GPS";
            this.classList.remove("activo");
          }
        });

      document
        .getElementById("btnMostrarWaypoints")
        .addEventListener("click", function () {
          mostrarTodosWaypoints = !mostrarTodosWaypoints;

          const waypoints =
            JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

          if (mostrarTodosWaypoints) {
            this.classList.add("activo");

            waypoints.forEach(function (waypoint) {
              const marcador = L.marker([waypoint.latitud, waypoint.longitud])
                .addTo(mapa)
                .bindPopup(waypoint.nombre);

              marcadoresWaypoints.push(marcador);
            });
          } else {
            this.classList.remove("activo");

            marcadoresWaypoints.forEach(function (marcador) {
              mapa.removeLayer(marcador);
            });

            marcadoresWaypoints = [];
          }
        });

      document
        .getElementById("btnGrabarTrack")
        .addEventListener("click", async function () {
          if (grabandoTrack === false) {
            if (!window.showDirectoryPicker) {
              alert(
                "Este navegador no permite seleccionar una carpeta directamente.",
              );
              return;
            }

            try {
              carpetaTrackHandle = await recuperarCarpetaTrack();

              if (carpetaTrackHandle !== null) {
                const permiso = await carpetaTrackHandle.queryPermission({
                  mode: "readwrite",
                });

                if (permiso !== "granted") {
                  const nuevoPermiso =
                    await carpetaTrackHandle.requestPermission({
                      mode: "readwrite",
                    });

                  if (nuevoPermiso !== "granted") {
                    carpetaTrackHandle = null;
                  }
                }
              }

              if (carpetaTrackHandle === null) {
                carpetaTrackHandle = await window.showDirectoryPicker({
                  mode: "readwrite",
                });

                await guardarCarpetaTrack(carpetaTrackHandle);
              }
            } catch (error) {
              console.log("Error al acceder a la carpeta:", error);

              return;
            }
            grabandoTrack = true;
            puntosTrackGrabado = [];

            if (lineaTrackGrabado !== null) {
              mapa.removeLayer(lineaTrackGrabado);
              lineaTrackGrabado = null;
            }
            this.textContent = "Parar track";
            this.classList.add("activo");

            alert("Grabación de track iniciada");
          } else {
            grabandoTrack = false;

            this.textContent = "Grabar track";
            this.classList.remove("activo");

            if (puntosTrackGrabado.length < 2) {
              alert("No hay suficientes puntos para guardar el track.");
              return;
            }

            let nombreTrack;

            while (true) {
              const nombre = prompt("Nombre del track:", "");

              if (nombre === null) {
                return;
              }

              nombreTrack = nombre.trim();

              if (nombreTrack === "") {
                nombreTrack = "Track";
              }

              nombreArchivo = nombreTrack + ".trk";

              try {
                await carpetaTrackHandle.getFileHandle(nombreArchivo);

                alert(
                  "Ya existe un track con el nombre:\n\n" +
                    nombreArchivo +
                    "\n\nEscriba otro nombre.",
                );
              } catch (error) {
                if (error.name === "NotFoundError") {
                  break;
                }

                console.log("Error al comprobar el archivo:", error);

                alert("No se ha podido comprobar si el archivo existe.");

                return;
              }
            }
            let contenidoTrack = "";

            puntosTrackGrabado.forEach(function (punto) {
              for (let i = 0; i < 11; i++) {
                contenidoTrack += punto[i] + "\n";
              }
            });

            //const nombreArchivo = nombreTrack + ".trk";

            try {
              const archivo = await carpetaTrackHandle.getFileHandle(
                nombreArchivo,
                { create: true },
              );

              const escritor = await archivo.createWritable();

              await escritor.write(contenidoTrack);

              await escritor.close();

              alert(
                "Track guardado en la carpeta seleccionada:\n" + nombreArchivo,
              );
            } catch (error) {
              console.log("Error al guardar el track:", error);

              alert(
                "No se ha podido guardar el track.\n\n" +
                  "Error: " +
                  error.name +
                  "\n" +
                  error.message,
              );
            }
          }
        });

      document
        .getElementById("btnProbarMapaSD")
        .addEventListener("click", async function () {
          if (!window.showDirectoryPicker) {
            alert("Este navegador no permite seleccionar carpetas.");
            return;
          }

          try {
            const carpeta = await window.showDirectoryPicker();

            // Guardamos la carpeta seleccionada para el mapa offline
            carpetaMapaSD = carpeta;

            // PRUEBA: añadir directamente el mapa offline
            mapaOffline.addTo(mapa);

            // Comprobamos que contiene las carpetas de zoom
            const niveles = [];

            for await (const entrada of carpeta.values()) {
              if (
                entrada.kind === "directory" &&
                ["12", "13", "14"].includes(entrada.name)
              ) {
                niveles.push(entrada.name);
              }
            }

            if (niveles.length === 0) {
              alert(
                "La carpeta seleccionada no contiene las carpetas 12, 13 o 14.",
              );
              carpetaMapaSD = null;
              return;
            }

            alert(
              "Mapa offline seleccionado correctamente.\n\n" +
                "Carpeta: " +
                carpeta.name +
                "\n\n" +
                "Niveles encontrados: " +
                niveles.sort().join(", "),
            );
          } catch (error) {
            console.log("Error al seleccionar la carpeta del mapa:", error);

            carpetaMapaSD = null;

            alert("No se ha podido acceder a la carpeta del mapa.");
          }
        });

      let seguimientoGPS = null;
      let marcadorGPS = null;
      let lineaAlWaypoint = null;

      let ultimaLatitudGPS = null;
      let ultimaLongitudGPS = null;
      let rumboMapa = null;

      function guardarCarpetaTrack(handle) {
        return new Promise(function (resolve, reject) {
          const solicitud = indexedDB.open("PulgarcitoDB", 1);

          solicitud.onupgradeneeded = function () {
            const db = solicitud.result;

            if (!db.objectStoreNames.contains("configuracion")) {
              db.createObjectStore("configuracion");
            }
          };

          solicitud.onsuccess = function () {
            const db = solicitud.result;

            const transaccion = db.transaction("configuracion", "readwrite");

            const almacen = transaccion.objectStore("configuracion");

            almacen.put(handle, "carpetaTrack");

            transaccion.oncomplete = function () {
              db.close();
              resolve();
            };

            transaccion.onerror = function () {
              db.close();
              reject(transaccion.error);
            };
          };

          solicitud.onerror = function () {
            reject(solicitud.error);
          };
        });
      }

      function recuperarCarpetaTrack() {
        return new Promise(function (resolve, reject) {
          const solicitud = indexedDB.open("PulgarcitoDB", 1);

          solicitud.onupgradeneeded = function () {
            const db = solicitud.result;

            if (!db.objectStoreNames.contains("configuracion")) {
              db.createObjectStore("configuracion");
            }
          };

          solicitud.onsuccess = function () {
            const db = solicitud.result;

            const transaccion = db.transaction("configuracion", "readonly");

            const almacen = transaccion.objectStore("configuracion");

            const peticion = almacen.get("carpetaTrack");

            peticion.onsuccess = function () {
              db.close();
              resolve(peticion.result || null);
            };

            peticion.onerror = function () {
              db.close();
              reject(peticion.error);
            };
          };

          solicitud.onerror = function () {
            reject(solicitud.error);
          };
        });
      }

      // Obtener posición y comenzar seguimiento
      function obtenerPosicion() {
        if (!navigator.geolocation) {
          alert("Este dispositivo no permite obtener la posición GPS.");

          return;
        }

        // Si ya estaba activo, no iniciar otro seguimiento
        if (seguimientoGPS !== null) {
          return;
        }

        seguimientoGPS = navigator.geolocation.watchPosition(
          function (posicion) {
            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;
            const heading = posicion.coords.heading;

            if (seguirGPS && heading !== null && Number.isFinite(heading)) {
              const nuevoRumbo = (heading + 180) % 360;

              if (rumboMapa === null) {
                rumboMapa = nuevoRumbo;
              } else {
                let diferencia = nuevoRumbo - rumboMapa;

                if (diferencia > 180) {
                  diferencia -= 360;
                }

                if (diferencia < -180) {
                  diferencia += 360;
                }

                rumboMapa = rumboMapa + diferencia * 0.15;

                rumboMapa = (rumboMapa + 360) % 360;
              }

              mapa.setBearing(rumboMapa);
            }
            ultimaLatitudGPS = lat;
            ultimaLongitudGPS = lon;

            console.log("Latitud:", lat, "Longitud:", lon);

            if (grabandoTrack) {
              const ahora = new Date();

              const año = ahora.getFullYear();
              const mes = ahora.getMonth() + 1;
              const dia = ahora.getDate();
              const hora = ahora.getHours();
              const minuto = ahora.getMinutes();
              const segundo = ahora.getSeconds();

              const bearing =
                posicion.coords.heading !== null ? posicion.coords.heading : 0;

              const speed =
                posicion.coords.speed !== null ? posicion.coords.speed : 0;

              const altitude =
                posicion.coords.altitude !== null
                  ? posicion.coords.altitude
                  : 0;

              const punto = [
                lat,
                lon,
                año,
                mes,
                dia,
                hora,
                minuto,
                segundo,
                bearing,
                speed,
                altitude,
              ];

              const ahoraMilisegundos = Date.now();

              let aceptarPunto = false;

              if (ultimoTiempoTrack === null) {
                aceptarPunto = true;
              } else {
                const tiempoTranscurrido =
                  ahoraMilisegundos - ultimoTiempoTrack;

                const distancia = calcularDistancia(
                  ultimaLatitudTrack,
                  ultimaLongitudTrack,
                  lat,
                  lon,
                );

                if (tiempoTranscurrido >= 1000 && distancia >= 10) {
                  aceptarPunto = true;
                }
              }

              if (aceptarPunto) {
                puntosTrackGrabado.push(punto);

                ultimoTiempoTrack = ahoraMilisegundos;
                ultimaLatitudTrack = lat;
                ultimaLongitudTrack = lon;

                document.getElementById("contadorPuntos").textContent =
                  "Puntos grabados: " + puntosTrackGrabado.length;

                document.getElementById("contadorPuntos").style.display =
                  "block";

                const puntosParaDibujar = puntosTrackGrabado.map(
                  function (punto) {
                    return [punto[0], punto[1]];
                  },
                );

                if (lineaTrackGrabado === null) {
                  lineaTrackGrabado = L.polyline(puntosParaDibujar, {
                    color: "red",
                    weight: 4,
                  }).addTo(mapa);
                } else {
                  lineaTrackGrabado.setLatLngs(puntosParaDibujar);
                }
              }
            }

            // Centrar el mapa solamente si está activado
            // el seguimiento GPS
            if (marcadorGPS === null || seguirGPS) {
              mapa.panTo([lat, lon], {
                animate: false,
              });
            }

            // Crear el marcador solamente la primera vez
            if (marcadorGPS === null) {
              marcadorGPS = L.marker([lat, lon])
                .addTo(mapa)
                .bindPopup("Mi posición");
            } else {
              // En las siguientes lecturas,
              // solamente mover el marcador
              marcadorGPS.setLatLng([lat, lon]);
            }
            // Actualizar la línea hacia el waypoint activo
            actualizarLineaAlWaypoint();
            actualizarDistanciasYRumbos();
          },

          function (error) {
            alert("No se ha podido obtener la posición GPS.");

            console.log(error);

            seguimientoGPS = null;
          },

          {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000,
          },
        );
      }
      document

      function mostrarListaWaypoints() {
        const lista = document.getElementById("listaWaypoints");

        lista.innerHTML = "";

        const waypoints =
          JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

        if (waypoints.length === 0) {
          lista.innerHTML = "<p>No hay waypoints guardados.</p>";
        } else {
          waypoints.forEach(function (waypoint, indice) {
            const elemento = document.createElement("div");

            elemento.className = "waypointItem";

            elemento.innerHTML =

              waypoint.longitud.toFixed(6) +

              '<span class="distanciaWaypoint">' +

              "</span>" +
              "<br>" +
              '<span class="rumboWaypoint">' +
              "Rumbo: calculando..." +
              "</span>" +
              "<br>" +
              '<button class="btnBorrarWaypoint">' +
              "Borrar" +
              "</button>";

            elemento.addEventListener("click", function (evento) {
              if (evento.target.classList.contains("btnBorrarWaypoint")) {
                const confirmar = confirm(
                  '¿Desea borrar el waypoint "' + waypoint.nombre + '"?',
                );

                if (confirmar === false) {
                  return;
                }

                waypoints.splice(indice, 1);

                localStorage.setItem(
                  "pulgarcitoWaypoints",
                  JSON.stringify(waypoints),
                );

                mapa.closePopup();

                location.reload();

                return;
              }

              // Guardar este waypoint como destino activo
              waypointActivo = waypoint;
              destinoAlcanzado = false;
              if (marcadorWaypoint !== null) {
                mapa.removeLayer(marcadorWaypoint);
              }

              marcadorWaypoint = L.marker([waypoint.latitud, waypoint.longitud])
                .addTo(mapa)
                .bindPopup(waypoint.nombre)
                .openPopup();
              console.log("Waypoint activo:", waypoint.nombre);
              document.getElementById("nombreDestino").textContent =
                waypoint.nombre;

              document.getElementById("infoDestino").style.display = "block";

              if (ultimaLatitudGPS !== null && ultimaLongitudGPS !== null) {
                const distancia = calcularDistancia(
                  ultimaLatitudGPS,
                  ultimaLongitudGPS,
                  waypoint.latitud,
                  waypoint.longitud,
                );

                const rumbo = calcularRumbo(
                  ultimaLatitudGPS,
                  ultimaLongitudGPS,
                  waypoint.latitud,
                  waypoint.longitud,
                );

                document.getElementById("distanciaDestino").textContent =
                  "Distancia: " + Math.round(distancia) + " m";

                document.getElementById("rumboDestino").textContent =
                  "Rumbo: " + Math.round(rumbo) + "°";
              } else {
                document.getElementById("distanciaDestino").textContent =
                  "Distancia: GPS no disponible";

                document.getElementById("rumboDestino").textContent =
                  "Rumbo: GPS no disponible";
              } // Centrar el mapa
              mapa.setView([waypoint.latitud, waypoint.longitud], 16);

              // Cerrar la lista
              document.getElementById("panelWaypoints").style.display = "none";
            });

            lista.appendChild(elemento);

            // Calcular distancia
          });
        }

        document.getElementById("panelWaypoints").style.display = "block";
      }
      function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371000;

        const rad = Math.PI / 180;

        const dLat = (lat2 - lat1) * rad;

        const dLon = (lon2 - lon1) * rad;

        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * rad) *
            Math.cos(lat2 * rad) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c;
      }

      function calcularRumbo(lat1, lon1, lat2, lon2) {
        const rad = Math.PI / 180;

        const phi1 = lat1 * rad;
        const phi2 = lat2 * rad;

        const deltaLon = (lon2 - lon1) * rad;

        const y = Math.sin(deltaLon) * Math.cos(phi2);

        const x =
          Math.cos(phi1) * Math.sin(phi2) -
          Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLon);

        let rumbo = Math.atan2(y, x) / rad;

        rumbo = (rumbo + 360) % 360;

        return rumbo;
      }

      function actualizarLineaAlWaypoint() {
        // Si no hay waypoint activo, no hacemos nada
        if (waypointActivo === null) {
          return;
        }

        // Si todavía no tenemos posición GPS, no hacemos nada
        if (ultimaLatitudGPS === null || ultimaLongitudGPS === null) {
          return;
        }

        const puntoActual = [ultimaLatitudGPS, ultimaLongitudGPS];

        const puntoWaypoint = [waypointActivo.latitud, waypointActivo.longitud];

        // Crear la línea la primera vez
        if (lineaAlWaypoint === null) {
          lineaAlWaypoint = L.polyline([puntoActual, puntoWaypoint], {
            weight: 4,
          }).addTo(mapa);
        } else {
          // En las siguientes posiciones,
          // solamente actualizar los dos puntos
          lineaAlWaypoint.setLatLngs([puntoActual, puntoWaypoint]);
        }
      }

      function actualizarDistanciasYRumbos() {
        const waypoints =
          JSON.parse(localStorage.getItem("pulgarcitoWaypoints")) || [];

        const elementos = document.querySelectorAll(".waypointItem");

        elementos.forEach(function (elemento, indice) {
          if (ultimaLatitudGPS === null || ultimaLongitudGPS === null) {
            return;
          }

          const waypoint = waypoints[indice];

          if (!waypoint) {
            return;
          }

          const distancia = calcularDistancia(
            ultimaLatitudGPS,
            ultimaLongitudGPS,
            waypoint.latitud,
            waypoint.longitud,
          );

          const rumbo = calcularRumbo(
            ultimaLatitudGPS,
            ultimaLongitudGPS,
            waypoint.latitud,
            waypoint.longitud,
          );

          elemento.querySelector(".distanciaWaypoint").textContent =
            "Distancia: " + Math.round(distancia) + " m";

          elemento.querySelector(".rumboWaypoint").textContent =
            "Rumbo: " + Math.round(rumbo) + "°";
        });
        if (
          waypointActivo !== null &&
          ultimaLatitudGPS !== null &&
          ultimaLongitudGPS !== null
        ) {
          const distanciaDestino = calcularDistancia(
            ultimaLatitudGPS,
            ultimaLongitudGPS,
            waypointActivo.latitud,
            waypointActivo.longitud,
          );

          const rumboDestino = calcularRumbo(
            ultimaLatitudGPS,
            ultimaLongitudGPS,
            waypointActivo.latitud,
            waypointActivo.longitud,
          );

          document.getElementById("distanciaDestino").textContent =
            "Distancia: " + Math.round(distanciaDestino) + " m";

          document.getElementById("rumboDestino").textContent =
            "Rumbo: " + Math.round(rumboDestino) + "°";
          // if (distanciaDestino <= 20 && destinoAlcanzado === false) {
          //   destinoAlcanzado = true;
          //   if (distanciaDestino <= 20 && destinoAlcanzado === false) {
          //     destinoAlcanzado = true;

          //     reproducirSonidoDestino();

          //     document.getElementById("distanciaDestino").textContent =
          //       "DESTINO ALCANZADO";
          //   }
          // }
          if (distanciaDestino <= 20 && destinoAlcanzado === false) {
            destinoAlcanzado = true;

            reproducirSonidoDestino();

            document.getElementById("distanciaDestino").textContent =
              "DESTINO ALCANZADO";
          }
        }
      }
