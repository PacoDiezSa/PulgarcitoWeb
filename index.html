<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pulgarcito Web</title>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      #mapa {
        width: 100%;
        height: 100%;
      }

      #btnGPS {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      #btnSeguirGPS {
        position: absolute;
        top: 65px;
        left: 15px;
        z-index: 1000;

        padding: 12px 18px;
        font-size: 16px;

        border: none;
        border-radius: 8px;

        background: white;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>

  <body>
    <button id="btnGPS">Mi posición</button>
    <button id="btnSeguirGPS">Seguir GPS</button>

    <div id="mapa"></div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      // Crear mapa
      const mapa = L.map("mapa").setView([43.4623, -3.8099], 13);

      // Mapa OpenStreetMap provisional
      // Ortofoto PNOA Máxima Actualidad del IGN
      L.tileLayer
        .wms("https://www.ign.es/wms-inspire/pnoa-ma", {
          layers: "OI.OrthoimageCoverage",
          format: "image/jpeg",
          transparent: false,
          version: "1.3.0",
          attribution: "PNOA © Instituto Geográfico Nacional",
        })
        .addTo(mapa);
      // Botón GPS
      document
        .getElementById("btnGPS")
        .addEventListener("click", obtenerPosicion);
      let seguirGPS = false;

      document
        .getElementById("btnSeguirGPS")
        .addEventListener("click", function () {
          seguirGPS = !seguirGPS;

          if (seguirGPS) {
            this.textContent = "No seguir GPS";
          } else {
            this.textContent = "Seguir GPS";
          }
        });
      let seguimientoGPS = null;
      let marcadorGPS = null;

      // Obtener posición y comenzar seguimiento
      function obtenerPosicion() {
        if (!navigator.geolocation) {
          alert("Este dispositivo no permite obtener la posición GPS.");

          return;
        }

        // Si ya estaba activo, no iniciar otro seguimiento
        if (seguimientoGPS !== null) {
          return;
        }

        seguimientoGPS = navigator.geolocation.watchPosition(
          function (posicion) {
            const lat = posicion.coords.latitude;

            const lon = posicion.coords.longitude;

            console.log("Latitud:", lat, "Longitud:", lon);

            // Centrar el mapa solamente si está activado
            // el seguimiento GPS
            if (seguirGPS) {
              mapa.setView([lat, lon], 16);
            }
            // Crear el marcador solamente la primera vez
            if (marcadorGPS === null) {
              marcadorGPS = L.marker([lat, lon])
                .addTo(mapa)
                .bindPopup("Mi posición");
            } else {
              // En las siguientes lecturas,
              // solamente mover el marcador
              marcadorGPS.setLatLng([lat, lon]);
            }
          },

          function (error) {
            alert("No se ha podido obtener la posición GPS.");

            console.log(error);

            seguimientoGPS = null;
          },

          {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000,
          },
        );
      }
    </script>
  </body>
</html>
